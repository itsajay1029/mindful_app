org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Windows/OneDrive stability tweaks:
# - Disable Gradle VFS watching (can keep handles open and break clean/build)
# - Disable caching of file system state (avoid snapshot issues with reparse points)
org.gradle.vfs.watch=false
