<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            border-radius: 2px;
        }
        .celebration-rays {
            background: radial-gradient(circle, rgba(255,255,255,0) 0%, rgba(252,203,82,0.1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface overflow-hidden">
<!-- Celebration Background Shell -->
<div class="relative min-h-screen w-full flex flex-col items-center justify-center overflow-hidden px-6">
<!-- Subtle Celebratory Rays Overlay -->
<div class="absolute inset-0 celebration-rays pointer-events-none"></div>
<!-- Confetti Simulation (Static Representation) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="confetti-piece bg-primary top-10 left-[10%] rotate-12"></div>
<div class="confetti-piece bg-tertiary top-40 left-[25%] -rotate-45"></div>
<div class="confetti-piece bg-secondary top-20 left-[60%] rotate-45"></div>
<div class="confetti-piece bg-primary-container top-80 left-[5%] rotate-12"></div>
<div class="confetti-piece bg-tertiary-container top-60 left-[85%] -rotate-12"></div>
<div class="confetti-piece bg-secondary-container top-15 left-[90%] rotate-90"></div>
<div class="confetti-piece bg-primary top-[80%] left-[40%] rotate-12 w-3 h-3"></div>
<div class="confetti-piece bg-secondary top-[75%] left-[75%] -rotate-12 w-4 h-2"></div>
</div>
<!-- Main Content Card (Floating Surface Container) -->
<div class="relative z-10 w-full max-w-lg flex flex-col items-center text-center space-y-8 py-12">
<!-- Mascot with Crown -->
<div class="relative group">
<!-- Floating Halo/Glow -->
<div class="absolute -inset-4 bg-secondary/20 blur-3xl rounded-full"></div>
<div class="relative w-48 h-48 md:w-56 md:h-56 bg-surface-container-low rounded-full flex items-center justify-center shadow-[0_32px_48px_rgba(43,102,74,0.1)] overflow-hidden">
<img class="w-4/5 h-4/5 object-contain" data-alt="A cute, friendly emerald green owl mascot wearing a small golden crown, looking ecstatic with large joyful eyes and spreading its wings" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkII9dZAwOTcK2ucX0HmUO-JmoK2IGYMvboz2Sj95zB_ZSG6Lm8iDCQLp-jPNoYQf1BHd5dC9BwwCEvoQ1MA6nWT4x9Tw5EuUBQGdkjRK14kZg6zgQA6Svd8w0fFpVsU9QMotanMPQd-rUKepbBCMhczZr3fw7nnNkNOXUkRCwUz8-WDzny-KHW19A-EGwqMKX8-aKt8uXeRNTuHaWLlbHjGgES-zcEyhDto9qE75jn0X2fzOBTSS_4IwSsDNXqJxKnInkbV27mxcg"/>
</div>
<!-- Mini Sticker Badge (Achievement) -->
<div class="absolute -top-4 -right-2 bg-tertiary-container p-3 rounded-xl shadow-lg rotate-12 border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
</div>
<!-- Header Section -->
<div class="space-y-2">
<h1 class="text-5xl md:text-6xl font-headline font-extrabold tracking-tight text-primary drop-shadow-sm">
                    Mastermind!
                </h1>
<p class="text-on-surface-variant font-medium text-lg">
                    You decoded the riddle with ease.
                </p>
</div>
<!-- Reward Bento Grid -->
<div class="grid grid-cols-2 gap-4 w-full">
<!-- Streak Card -->
<div class="bg-surface-container-lowest p-6 rounded-lg shadow-[0_16px_32px_rgba(0,0,0,0.04)] flex flex-col items-center justify-center space-y-2 group transition-all duration-300 hover:scale-105">
<div class="relative">
<span class="material-symbols-outlined text-5xl text-tertiary" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<div class="absolute -top-1 -right-1 flex h-4 w-4">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>
<span class="relative inline-flex rounded-full h-4 w-4 bg-tertiary"></span>
</div>
</div>
<div class="text-3xl font-headline font-extrabold text-on-surface">13</div>
<div class="bg-tertiary-container/20 px-3 py-1 rounded-full">
<span class="text-[10px] font-label font-bold text-on-tertiary-container uppercase tracking-wider">Streak Extended!</span>
</div>
</div>
<!-- XP Card -->
<div class="bg-surface-container-lowest p-6 rounded-lg shadow-[0_16px_32px_rgba(0,0,0,0.04)] flex flex-col items-center justify-center space-y-2 group transition-all duration-300 hover:scale-105">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center shadow-[0_8px_20px_rgba(116,87,0,0.2)]">
<span class="material-symbols-outlined text-on-secondary-fixed text-2xl font-bold">monetization_on</span>
</div>
<div class="text-3xl font-headline font-extrabold text-on-surface">+50 XP</div>
<div class="bg-secondary-container/20 px-3 py-1 rounded-full">
<span class="text-[10px] font-label font-bold text-on-secondary-container uppercase tracking-wider">Vault Reward</span>
</div>
</div>
</div>
<!-- Actions Section -->
<div class="w-full space-y-4 pt-4">
<button class="group w-full bg-primary hover:bg-primary-dim text-on-primary text-lg font-bold py-5 rounded-xl transition-all duration-200 shadow-[0_8px_0_rgba(48,108,79,1)] active:shadow-none active:translate-y-2 flex items-center justify-center space-x-2">
<span>Keep it going!</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant font-bold py-4 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 border-2 border-transparent hover:border-outline-variant/30">
<span class="material-symbols-outlined">share</span>
<span>Share Achievement</span>
</button>
</div>
<!-- Footer Small Hint -->
<p class="text-on-surface-variant/60 font-label text-xs uppercase tracking-widest pt-8">
                Daily Quest Progress: 80% Complete
            </p>
</div>
<!-- Background Decorative Elements -->
<div class="absolute -bottom-10 -left-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -top-10 -right-10 w-64 h-64 bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<!-- Navigation suppression check: This is a success screen, bottom nav is hidden -->
</body></html>
